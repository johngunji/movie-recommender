<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommender</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">

    <header class="text-center mb-5">
        <div class="icon-brand">🎬</div>
        <h1 class="gradient-text">Movie Recommender</h1>
    </header>

    <div class="search-card p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-5">
                <input id="movie" class="form-control custom-input" placeholder="Movie name">
            </div>

            <div class="col-md-3">
                <select id="type" class="form-select custom-input">
                    <option value="">All</option>
                    <option value="movie">Movie</option>
                    <option value="tv show">TV Show</option>
                </select>
            </div>

            <div class="col-md-3">
                <select id="platform" class="form-select custom-input">
                    <option value="">Any Platform</option>
                    <option value="Netflix / Disney">Netflix / Disney</option>
                    <option value="Prime Video">Prime Video</option>
                </select>
            </div>

            <div class="col-md-1">
                <button onclick="fetchRecommendations(true)"
                        class="btn btn-recommend w-100">Go</button>
            </div>
        </div>
    </div>

    <div id="results" class="row g-4"></div>

    <div class="text-center mt-4">
        <button id="showMoreBtn"
                class="btn btn-outline-light d-none"
                onclick="loadMore()">Show More</button>
    </div>
</div>

<script>
let offset = 0;
const LIMIT = 10;

function saveRecommendation(movie) {
    const saved = JSON.parse(localStorage.getItem("savedMovies")) || [];
    if (!saved.some(m => m.title === movie.title)) {
        saved.push(movie);
        localStorage.setItem("savedMovies", JSON.stringify(saved));
    }
}

async function fetchRecommendations(reset = true) {
    const results = document.getElementById("results");

    if (reset) {
        offset = 0;
        results.innerHTML = "";
    }

    const payload = {
        movie: document.getElementById("movie").value,
        type: document.getElementById("type").value,
        platform: document.getElementById("platform").value,
        start: offset,
        limit: LIMIT
    };

    const res = await fetch("/recommend", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    data.forEach(m => {
        saveRecommendation(m);
        results.insertAdjacentHTML("beforeend", `
            <div class="col-md-3">
                <div class="movie-card">
                    <div class="img-wrapper">
                        <img src="${m.poster}">
                    </div>
                    <div class="card-body">
                        <div class="movie-genres">${m.genres}</div>
                        <div class="movie-title">${m.title}</div>
                    </div>
                </div>
            </div>
        `);
    });

    offset += LIMIT;
    document.getElementById("showMoreBtn")
        .classList.toggle("d-none", data.length < LIMIT);
}

function loadMore() {
    fetchRecommendations(false);
}

window.onload = () => {
    const saved = JSON.parse(localStorage.getItem("savedMovies")) || [];
    const results = document.getElementById("results");

    if (!saved.length) return;

    results.innerHTML = "";
    saved.forEach(m => {
        results.insertAdjacentHTML("beforeend", `
            <div class="col-md-3">
                <div class="movie-card">
                    <div class="img-wrapper">
                        <img src="${m.poster}">
                    </div>
                    <div class="card-body">
                        <div class="movie-genres">${m.genres}</div>
                        <div class="movie-title">${m.title}</div>
                    </div>
                </div>
            </div>
        `);
    });
};
</script>

</body>
</html>
